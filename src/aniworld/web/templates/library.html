{% extends "base.html" %}

{% block title %}Library - AniWorld Downloader{% endblock %}

{% block content %}
<div class="container container-narrow">
  <div class="page-head">
    <h1 data-i18n="library.title">Library</h1>
    <div class="page-head-actions">
      <label class="lib-show-hidden">
        <input type="checkbox" id="libraryShowHidden" />
        <span>Show hidden</span>
      </label>
      <button class="btn btn-ghost" id="libraryRefresh" data-i18n="common.refresh">Refresh</button>
    </div>
  </div>
  <p class="page-hint" data-i18n="library.hint">
    Everything you have downloaded, as a poster wall. Click a card to see its episodes.
  </p>
  <div id="libraryTree" class="library-tree"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='library.js') }}?v={{ static_version }}"></script>
{% endblock %}
